<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b8913f'><path d='M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4z'/></svg>">
  <title>Client Portal Sign In — Royal Events Management</title>
</head>
<body class="portal-body">
  <nav class="nav">
    <div class="container">
      <a href="/" class="brand">
        <svg class="crown" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4z"/><rect x="3" y="19.5" width="18" height="1.8" rx=".9"/></svg>
        <span>Royal Events</span>
      </a>
      <div style="display:flex;gap:10px;align-items:center" id="nav-actions">
        <a href="/" class="btn ghost small">Website</a>
      </div>
    </div>
  </nav>
  <main class="auth-wrap">
    <form class="card auth-card form" id="login-form">
      <span class="eyebrow">Client Portal</span>
      <h1>Welcome back</h1>
      <p class="muted" style="margin-top:-8px">Sign in to see your wedding plan, fill in details we need and message the team.</p>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <div class="form-msg" id="login-msg"></div>
      <button class="btn" type="submit">Sign In</button>
      <p class="muted" style="font-size:.9rem;margin:0">Don't have a login yet? Your planner will send you one once your date is booked. <a href="/#contact">Get in touch</a>.</p>
    </form>
  </main>
  <script src="/portal/portal.js"></script>
  <script>
    Portal.me().then((u) => { if (u) location.href = u.role === 'admin' ? '/portal/admin' : '/portal/client'; });
    const f = document.getElementById('login-form');
    const m = document.getElementById('login-msg');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = f.querySelector('button'); btn.disabled = true;
      try {
        const u = await Portal.api('/api/auth/login', { method: 'POST', body: Object.fromEntries(new FormData(f)) });
        location.href = u.role === 'admin' ? '/portal/admin' : '/portal/client';
      } catch (err) { m.textContent = err.message; m.className = 'form-msg show err'; btn.disabled = false; }
    });
  </script>
</body>
</html>
